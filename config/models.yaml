# LLM model routing and fallbacks

version: 1

# Client-side HTTP timeout for LLM calls. Wired into the chat model
# constructors in llm/registry.py. It matters more now that calls traverse the
# AI Gateway: an unset timeout on a hop in front of a 12-minute draft call is a
# hang with no upper bound, not a slow call.
defaults:
  timeout_s: 600

# One retry policy for every outbound service call — MLflow prompt fetches,
# Blogger publishing, and LLM invocations all read these numbers. Adding a
# retry anywhere else means using agentic_blogger/resilience.py, not a second
# set of constants.
#
# Note: LangChain's Runnable .with_retry() only accepts an attempt count and a
# jitter flag, so the LLM path honours max_attempts and jitter but not the
# backoff bounds. tenacity call sites honour all four.
resilience:
  max_attempts: 5
  initial_backoff_s: 1
  max_backoff_s: 30
  jitter: true

# Prompt text lives in the MLflow Prompt Registry, which is the only source of
# truth for it. There is no local fallback by design: if the registry is
# unreachable the pipeline fails the job rather than running on stale or
# default text.
#
# cache_ttl_seconds is set explicitly rather than inheriting MLflow's implicit
# 60s alias-cache default. It is the window in which an edited prompt has not
# taken effect yet, and equally the window in which a registry outage stays
# invisible — those are the same number, so tune it deliberately.
prompts:
  alias: production
  cache_ttl_seconds: 300

# Every LLM call leaves this process addressed to the MLflow AI Gateway, never
# to a provider directly. The gateway holds the provider credentials (encrypted,
# server-side), records per-model token/cost/latency usage, and enforces the
# budget and rate-limit policies configured in its UI.
#
# This is a hard dependency, matching `prompts:` above: a gateway outage fails
# the job. There is deliberately no bypass — a bypass would mean spend that no
# budget sees and calls that no usage table records, which is the whole point
# of routing through it.
#
# Endpoint names registered in the gateway are exactly the model ids below
# ("claude-opus-5", "qwen3.5:9b", ...). That convention is load-bearing: it lets
# `provider:model` keys and per-node cost attribution in llm/callbacks.py keep
# working with base_url as the only thing that changed.
gateway:
  enabled: true

  # Empty = derive from MLFLOW_TRACKING_URI (+ "/gateway"), so the MLflow host
  # is configured in exactly one place — docker-compose.yml. Set a literal URL
  # here only to point at a gateway that is not the tracking server.
  base_url: ""

  # Which call surface each provider uses.
  #   passthrough — {base_url}/{provider}, provider-native request body
  #                 forwarded as-is. Required for Anthropic: server tools
  #                 (web_search/web_fetch), adaptive thinking blocks, and the
  #                 prompt-cache token buckets only exist in that body shape.
  #   openai      — the unified {base_url}/mlflow/v1 OpenAI-compatible surface,
  #                 addressed by endpoint name. Used for providers with nothing
  #                 provider-specific to preserve.
  # Anthropic is the only passthrough. langchain-google-genai cannot address
  # the gateway's Gemini route (/gemini/v1beta/models/{endpoint}:generateContent)
  # without reaching into its transport, and nothing in the Gemini or Ollama
  # request shape needs preserving the way Anthropic's server tools do — so
  # they take the unified surface, which one client speaks for all of them.
  surfaces:
    anthropic: passthrough
    gemini: openai
    openai: openai
    ollama: openai

providers:
  anthropic:
    kind: anthropic
    api_key_secret: ANTHROPIC_API_KEY

  openai:
    kind: openai
    api_key_secret: OPENAI_API_KEY

  gemini:
    kind: gemini
    api_key_secret: GEMINI_API_KEY

  ollama:
    kind: ollama
    base_url: "http://host.docker.internal:11434"

roles:
  # Restructures the raw research into ResearchBrief. Must reproduce code
  # exemplars verbatim with their source URLs intact, so it needs both real
  # instruction-following and enough output headroom for the code blocks.
  research_synth:
    model: "anthropic:claude-sonnet-5"
    max_tokens: 16000
    effort: low

  outline:
    model: "anthropic:claude-haiku-4-5"
    max_tokens: 4000
    effort: low

  draft:
    model: "anthropic:claude-opus-5"
    max_tokens: 32000
    effort: high

  factcheck:
    model: "anthropic:claude-opus-5"
    max_tokens: 16000
    effort: high

  seo:
    model: "anthropic:claude-haiku-4-5"
    max_tokens: 4000
    effort: low

  script:
    model: "anthropic:claude-haiku-4-5"
    max_tokens: 8000
    effort: low

  # Bound to the web_search_20260209 / web_fetch_20260209 server tools, which
  # require Opus 4.6+ or Sonnet 4.6+ — Haiku 4.5 rejects both type strings.
  # No fallback is declared on purpose: a local model cannot run server tools,
  # so falling back would produce an unsourced brief instead of a failure.
  search_tool:
    model: "anthropic:claude-sonnet-5"
    max_tokens: 16000
    effort: low

fallbacks:
  "anthropic:claude-opus-5":
    - "anthropic:claude-sonnet-5"

  "anthropic:claude-haiku-4-5":
    - "ollama:qwen3.5:9b"

search:
  provider: anthropic_server_tools
