version: "3.9"

services:
  tinydb:
    build:
      context: ./TinyDBService
      args:
        GIT_COMMIT: local
    image: agentic-blogger/tinydb:local
    container_name: agentic-blogger-tinydb
    networks:
      - blogger-net
    ports:
      - "127.0.0.1:28080:28080"
    environment:
      TINYDB_ENC_KEY: "${TINYDB_ENC_KEY:?TINYDB_ENC_KEY not set — export it or set it in .env}"
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
      TINYDB_PATH: "/data/db.json.enc"
      SERVICE_MODE: "credentials"
      APP_VERSION: "local"
    volumes:
      - "${VAULT_DIR:-./data/vault}:/data"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:28080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: agentic-blogger-postgres
    networks:
      - blogger-net
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_USER: agentic_blogger
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}"
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pgcrypto"
    volumes:
      - "${POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_blogger"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    build:
      context: ./services/mlflow
      args:
        PYTHON_VERSION: "3.12"
    image: agentic-blogger/mlflow:local
    container_name: agentic-blogger-mlflow
    networks:
      - blogger-net
    ports:
      - "127.0.0.1:25000:5000"
    environment:
      POSTGRES_MLFLOW_DSN: "postgresql+psycopg2://agentic_blogger:${POSTGRES_PASSWORD:?}@postgres:5432/mlflow"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlartifacts"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # The entrypoint pulls MLFLOW_CRYPTO_KEK_PASSPHRASE from TinyDB with
      # these two, the same way the orchestrator reads every other secret.
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
      TINYDB_URL: "http://tinydb:28080"
      # The job pool (judges, scorers, online scoring, webhooks) is unused
      # here and was a large share of the process count that made 2G too
      # small. Off, so the one uvicorn worker gets the memory.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      # How stale a budget-policy edit made in the UI can be before the
      # gateway honours it. Set explicitly for the same reason
      # prompts.cache_ttl_seconds is: the default (600s) is also the window
      # in which a tightened budget is not yet enforced.
      MLFLOW_GATEWAY_BUDGET_REFRESH_INTERVAL: "60"
      # How long the gateway waits on the provider before giving up on one
      # request. MLflow's default is 300s, which is shorter than a research
      # call's agentic web_search loop (max_uses 12) and cut one off at
      # exactly 300.9s — surfacing as a 500 the client cannot tell apart from
      # a real gateway fault. Kept ABOVE config/models.yaml defaults.timeout_s
      # (600) on purpose: the client's timeout should be the one that decides,
      # so the gateway never severs a call that is still producing.
      #
      # Ceiling, not a target. The gateway holds its single uvicorn worker for
      # the whole call (see --workers 1 in entrypoint.sh), so this is also the
      # longest one stuck call can block every other gateway request.
      MLFLOW_GATEWAY_ROUTE_TIMEOUT_SECONDS: "900"
      # The gateway is the only place cost is computed, and llm/callbacks.py
      # reads it back per call. Async export buffers spans for up to
      # MLFLOW_ASYNC_TRACE_LOGGING_MAX_INTERVAL_MILLIS (5000) before writing
      # them, which measured as a 4.7s wait before a call's cost became
      # queryable. Synchronous export writes the trace before the gateway
      # answers, so the cost row exists by the time the caller has its
      # response. The added latency is a local Postgres write against calls
      # that take seconds to minutes.
      MLFLOW_ENABLE_ASYNC_TRACE_LOGGING: "false"
    # The gateway, not the orchestrator, is now the process that talks to
    # Ollama for the qwen3.5:9b fallback, so it is this container that needs
    # a route to the host's Ollama.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${MLFLOW_ARTIFACTS:-./data/mlartifacts}:/mlartifacts"
    depends_on:
      postgres:
        condition: service_healthy
      tinydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 512M was enough for MLflow 2.18. 3.x pins the container at its
          # ceiling and uvicorn's workers get OOM-killed on spawn — the server
          # logs "Child process died" in a loop with no traceback, because
          # SIGKILL leaves none.
          #
          # 2G was then not enough either: 3.x runs ~16 processes — 4 uvicorn
          # workers (--workers defaults to 4) plus a huey consumer pool for
          # mlflow.server.jobs — at roughly 250 MiB each. That sat at 2013 MiB
          # anon against a 2048 MiB cap, with 358 forced-reclaim events and
          # socket throttling.
          #
          # Both remedies are now applied: the entrypoint pins --workers 1
          # (also required for correct budget accounting, see the note there)
          # and MLFLOW_SERVER_ENABLE_JOB_EXECUTION is false above. 3G is kept
          # rather than cut back because the gateway holds a worker open for
          # the whole duration of every LLM call, including multi-minute
          # draft/factcheck ones — headroom is cheaper than a mid-job OOM.
          memory: 3G
          cpus: "1"

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: agentic-blogger/orchestrator:local
    container_name: agentic-blogger-orchestrator
    networks:
      - blogger-net
    environment:
      DATABASE_URL: "postgresql+psycopg2://agentic_blogger:${POSTGRES_PASSWORD:?}@postgres:5432/blogger"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blogger
      POSTGRES_USER: agentic_blogger
      TINYDB_HOST: tinydb
      TINYDB_PORT: "28080"
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # MLflow's REST client retries internally. At its defaults (7 retries,
      # backoff factor 2, 120s timeout) an unreachable registry takes many
      # minutes to surface — and prompt loading has no fallback, so that is a
      # multi-minute worker hang instead of a fast failure. These three are
      # the single retry policy for MLflow: prompt fetches are deliberately
      # NOT wrapped in the `resilience:` policy on top of them, because
      # stacking the two multiplied out to 35 HTTP attempts per prompt.
      # Applies to tracing calls too, which is wanted — tracing is fail-open
      # and should give up quickly rather than stall an otherwise-fine job.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "4"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR: "1"
      # Application log level. DEBUG adds prompt-resolution and per-call
      # payload detail; library loggers are floored independently in
      # observability/log_setup.py so DEBUG here does not unleash
      # langchain/httpcore internals.
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      tinydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"

  telegram:
    build:
      context: .
      dockerfile: services/telegram/Dockerfile
    image: agentic-blogger/telegram:local
    container_name: agentic-blogger-telegram
    networks:
      - blogger-net
    environment:
      DATABASE_URL: "postgresql+psycopg2://agentic_blogger:${POSTGRES_PASSWORD:?}@postgres:5432/blogger"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blogger
      POSTGRES_USER: agentic_blogger
      TINYDB_HOST: tinydb
      TINYDB_PORT: "28080"
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    depends_on:
      postgres:
        condition: service_healthy
      tinydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  blogger-net:
    name: ${DOCKER_NETWORK:-agentic-blogger-net}
    driver: bridge
