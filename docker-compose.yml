version: "3.9"

services:
  tinydb:
    build:
      context: ./TinyDBService
      args:
        GIT_COMMIT: local
    image: agentic-blogger/tinydb:local
    container_name: agentic-blogger-tinydb
    networks:
      - blogger-net
    ports:
      - "127.0.0.1:28080:28080"
    environment:
      TINYDB_ENC_KEY: "${TINYDB_ENC_KEY:?TINYDB_ENC_KEY not set — export it or set it in .env}"
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
      TINYDB_PATH: "/data/db.json.enc"
      SERVICE_MODE: "credentials"
      APP_VERSION: "local"
    volumes:
      - "${VAULT_DIR:-./data/vault}:/data"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:28080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: agentic-blogger-postgres
    networks:
      - blogger-net
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_USER: agentic_blogger
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}"
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pgcrypto"
    volumes:
      - "${POSTGRES_DATA:-./data/postgres}:/var/lib/postgresql/data"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic_blogger"]
      interval: 10s
      timeout: 5s
      retries: 3

  mlflow:
    build:
      context: ./services/mlflow
      args:
        PYTHON_VERSION: "3.12"
    image: agentic-blogger/mlflow:local
    container_name: agentic-blogger-mlflow
    networks:
      - blogger-net
    ports:
      - "127.0.0.1:25000:5000"
    environment:
      POSTGRES_MLFLOW_DSN: "postgresql+psycopg2://agentic_blogger:${POSTGRES_PASSWORD:?}@postgres:5432/mlflow"
      MLFLOW_DEFAULT_ARTIFACT_ROOT: "/mlartifacts"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - "${MLFLOW_ARTIFACTS:-./data/mlartifacts}:/mlartifacts"
    depends_on:
      postgres:
        condition: service_healthy
      tinydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 512M was enough for MLflow 2.18. 3.x pins the container at its
          # ceiling and uvicorn's workers get OOM-killed on spawn — the server
          # logs "Child process died" in a loop with no traceback, because
          # SIGKILL leaves none.
          #
          # 2G was then not enough either: 3.x runs ~16 processes — 4 uvicorn
          # workers (--workers defaults to 4) plus a huey consumer pool for
          # mlflow.server.jobs — at roughly 250 MiB each. That sat at 2013 MiB
          # anon against a 2048 MiB cap, with 358 forced-reclaim events and
          # socket throttling.
          #
          # If this needs raising again, prefer cutting processes over adding
          # RAM: `--workers 2` and MLFLOW_SERVER_ENABLE_JOB_EXECUTION=false
          # together drop most of it, and the job pool serves judges, scorers,
          # online scoring and webhooks — none of which this pipeline uses.
          memory: 3G
          cpus: "1"

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    image: agentic-blogger/orchestrator:local
    container_name: agentic-blogger-orchestrator
    networks:
      - blogger-net
    environment:
      DATABASE_URL: "postgresql+psycopg2://agentic_blogger:${POSTGRES_PASSWORD:?}@postgres:5432/blogger"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blogger
      POSTGRES_USER: agentic_blogger
      TINYDB_HOST: tinydb
      TINYDB_PORT: "28080"
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      # MLflow's REST client retries internally. At its defaults (7 retries,
      # backoff factor 2, 120s timeout) an unreachable registry takes many
      # minutes to surface — and prompt loading has no fallback, so that is a
      # multi-minute worker hang instead of a fast failure. These three are
      # the single retry policy for MLflow: prompt fetches are deliberately
      # NOT wrapped in the `resilience:` policy on top of them, because
      # stacking the two multiplied out to 35 HTTP attempts per prompt.
      # Applies to tracing calls too, which is wanted — tracing is fail-open
      # and should give up quickly rather than stall an otherwise-fine job.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "4"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
      MLFLOW_HTTP_REQUEST_BACKOFF_FACTOR: "1"
    depends_on:
      postgres:
        condition: service_healthy
      tinydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2"

  telegram:
    build:
      context: .
      dockerfile: services/telegram/Dockerfile
    image: agentic-blogger/telegram:local
    container_name: agentic-blogger-telegram
    networks:
      - blogger-net
    environment:
      DATABASE_URL: "postgresql+psycopg2://agentic_blogger:${POSTGRES_PASSWORD:?}@postgres:5432/blogger"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: blogger
      POSTGRES_USER: agentic_blogger
      TINYDB_HOST: tinydb
      TINYDB_PORT: "28080"
      SECRET_STORE_TOKEN: "${SECRET_STORE_TOKEN:-}"
    depends_on:
      postgres:
        condition: service_healthy
      tinydb:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

networks:
  blogger-net:
    name: ${DOCKER_NETWORK:-agentic-blogger-net}
    driver: bridge
